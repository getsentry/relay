version: 2
updates:
  - package-ecosystem: cargo
    open-pull-requests-limit: 0 # security updates only
    directory: "/"
    schedule:
      interval: daily
    # Fix all open advisories in a single PR. The `dependabot-cargo-update`
    # workflow runs a full `cargo update` on top of it.
    groups:
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"
    reviewers:
      - "@getsentry/ingest"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    reviewers:
      - "@getsentry/ingest"
    open-pull-requests-limit: 0 # security updates only

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    reviewers:
      - "@getsentry/ingest"
