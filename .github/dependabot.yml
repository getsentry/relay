version: 2
updates:
  - package-ecosystem: cargo
    open-pull-requests-limit: 0 # security updates only
    directory: "/"
    schedule:
      interval: daily
    groups:
      security: # see https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configure-security-updates#overriding-the-default-behavior-with-a-configuration-file
        applies-to: security-updates
        patterns:
          - "*"
    reviewers:
      - "@getsentry/ingest"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    reviewers:
      - "@getsentry/ingest"
    open-pull-requests-limit: 0 # security updates only

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    reviewers:
      - "@getsentry/ingest"
