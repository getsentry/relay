relay:
  # managed = project configs are fetched from upstream Sentry. Required because
  # `processing` (below) only works in managed mode, and processing is the only
  # way into a local Sentry: Sentry has no HTTP ingest endpoint any more, so a
  # forwarded envelope just hits the React catch-all and 403s on CSRF.
  #
  # `vars.publicKey` survives the round trip only because of the patch to
  # _merge_pii_configs in sentry (src/sentry/relay/datascrubbing.py) that carries
  # `vars` through the org+project merge. The piiConfig now lives on the Sentry
  # project option `sentry:relay_pii_config`, not in ./projects/*.json, and its
  # rule name arrives prefixed as `project:recoverable`.
  mode: managed

  # Upstream Sentry, used for registration and project config fetches. With
  # watchers on, the devserver binds Django to 8001 and gives 8000 to the rspack
  # proxy, so talk to 8001 rather than through the asset proxy.
  upstream: http://127.0.0.1:8001/

  host: 127.0.0.1
  port: 3001

processing:
  # Produce straight to Kafka, where Sentry's ingest-events consumer picks events
  # up. Requires a build with the feature enabled: `cargo run --all-features`.
  enabled: true
  kafka_config:
    - { name: "bootstrap.servers", value: "127.0.0.1:9092" }
    # Align with Relay's default `max_envelope_size` (200 MiB).
    - { name: "message.max.bytes", value: 209715200 }
  redis: redis://127.0.0.1:6379
logging:
  level: trace

limits:
  shutdown_timeout: 0

cache:
  # Defaults are 10s file poll and a 300s project cache, so edits to projects/*.json
  # take up to 5 minutes to apply. Shorten both so rule changes land immediately.
  file_interval: 1
  project_expiry: 1
  project_grace_period: 0
